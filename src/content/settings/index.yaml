heroTitle: Rathlouskolens Støtteforening
heroSubtitle: Støtter op om skolen for elever og personale
heroImage: /images/uploads/heroImage.svg
introTitle: OM STØTTEFORENINGEN
introText: >-
  Rathlouskolens støtteforening er en frivillig forening, som alle kan være
  medlem af.

  Foreningen har til formål at støtte op om Rathlouskolen og samle midler ind,
  som kan være til glæde for elever og personale på skolen.

  Alle skolens brugere kan søge om midler fra støtteforeningen.

  Foreningens indtægter opstår ved forskellige arrangementer afholdt af
  Støtteforeningen. Desuden betales et kontingent fra medlemmerne på årligt 150
  kr. Støtteforeningen tager også gerne imod sponsorater og gaver.
quotes:
  - quote: >-
      Det har en utrolig stor værdi for Rathlouskolen, at vi har en
      støtteforening. Støtteforeningen gør ting mulige for vores elever og
      personale. At opleve processen, hvor klasserne arbejder med ansøgningerne
      til støtteforeningen og opleve deres glæde, når de er så heldige at få
      tildelt penge, så deres ønske kan gå i opfyldelse, er en fantastisk
      proces. Udover glæden og sammenholdet det giver i en klasse, er det også
      en meget lærerigt for klasserne og mange er utrolige kreative med både
      ansøgninger og hvad der søges til.
    author: '- Skoleleder Dorte Halberg'
